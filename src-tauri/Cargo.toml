[package]
name = "cleanotes"
version = "0.3.0"
description = "CleaNotes - a local-first Markdown note-taking and study app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cleanotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# OS-native secure credential store (macOS Keychain / Windows Credential Manager / Linux Secret
# Service) for the collaboration feature's device identity private key - see identity.rs. Chosen
# over tauri-plugin-stronghold, which the Tauri project has marked for removal in v3.
keyring = "3"

# WebKitGTK has no native permission-prompt UI of its own (unlike macOS/Windows) - see run()'s
# on_page_load hook in src/lib.rs, which shows an equivalent GTK dialog by hand.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
glib = "0.18"
gtk = "0.18"

# Used by run()'s on_page_load hook in src/lib.rs to opt the webview's layer into continuous
# redraw during a live window resize - see that hook's own comment for why. Versions left
# unpinned beyond the minor: both are already resolved transitively via tauri/wry, so this just
# names the versions already in the dependency graph rather than requesting new ones.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"

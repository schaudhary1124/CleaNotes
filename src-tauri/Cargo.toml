[package]
name = "plainotes"
version = "0.1.0"
description = "PlaiNotes - a local-first Markdown note-taking and study app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plainotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"

# WebKitGTK has no native permission-prompt UI of its own (unlike macOS/Windows) - see run()'s
# on_page_load hook in src/lib.rs, which shows an equivalent GTK dialog by hand.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
glib = "0.18"
gtk = "0.18"

